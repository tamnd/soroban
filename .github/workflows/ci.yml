name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: lesson runner
        run: go run ./cmd/soroban list && go run ./cmd/soroban 0001 && go run ./cmd/soroban 0002 && go run ./cmd/soroban 0003 && go run ./cmd/soroban 0004 && go run ./cmd/soroban 0005 && go run ./cmd/soroban 0006 && go run ./cmd/soroban 0007

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: lesson 0001 asserts
        run: uv run lessons/0001-one-neuron/train.py
      - name: lesson 0002 asserts
        run: uv run lessons/0002-hidden-layer/train.py
      - name: lesson 0003 asserts
        run: uv run lessons/0003-classification/train.py
      - name: lesson 0004 asserts
        run: uv run lessons/0004-autograd/train.py
      - name: lesson 0005 asserts
        run: uv run lessons/0005-bigram/train.py
      - name: lesson 0006 asserts
        run: uv run lessons/0006-neural-bigram/train.py
      - name: lesson 0007 asserts
        run: uv run lessons/0007-attention/train.py
      - name: lesson 0007 transformer (torch)
        run: uv run --with torch lessons/0007-attention/train.py --torch --train
      - name: notebooks execute clean
        run: |
          uv run --extra notebook python -c "
          import nbformat, nbclient
          for path in ('lessons/0001-one-neuron/lesson.ipynb',
                       'lessons/0002-hidden-layer/lesson.ipynb',
                       'lessons/0003-classification/lesson.ipynb',
                       'lessons/0004-autograd/lesson.ipynb',
                       'lessons/0005-bigram/lesson.ipynb',
                       'lessons/0006-neural-bigram/lesson.ipynb',
                       'lessons/0007-attention/lesson.ipynb'):
              nb = nbformat.read(path, as_version=4)
              nbclient.NotebookClient(nb, timeout=300).execute()
              print(path, 'executed clean')
          "

  cross-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: astral-sh/setup-uv@v5
      - name: python and go print identical tables
        run: |
          uv run lessons/0001-one-neuron/train.py | head -6 > /tmp/py.out
          go run ./cmd/soroban 0001 > /tmp/go.out
          diff /tmp/py.out /tmp/go.out
          uv run lessons/0002-hidden-layer/train.py | head -6 > /tmp/py2.out
          go run ./cmd/soroban 0002 > /tmp/go2.out
          diff /tmp/py2.out /tmp/go2.out
          uv run lessons/0003-classification/train.py | head -6 > /tmp/py3.out
          go run ./cmd/soroban 0003 > /tmp/go3.out
          diff /tmp/py3.out /tmp/go3.out
          uv run lessons/0004-autograd/train.py | head -7 > /tmp/py4.out
          go run ./cmd/soroban 0004 > /tmp/go4.out
          diff /tmp/py4.out /tmp/go4.out
          uv run lessons/0005-bigram/train.py | head -7 > /tmp/py5.out
          go run ./cmd/soroban 0005 > /tmp/go5.out
          diff /tmp/py5.out /tmp/go5.out
          uv run lessons/0006-neural-bigram/train.py | head -7 > /tmp/py6.out
          go run ./cmd/soroban 0006 > /tmp/go6.out
          diff /tmp/py6.out /tmp/go6.out
          uv run lessons/0007-attention/train.py | head -7 > /tmp/py7.out
          go run ./cmd/soroban 0007 > /tmp/go7.out
          diff /tmp/py7.out /tmp/go7.out
